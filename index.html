<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thống kê tiền 12 tháng</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f9;
    color: #172033;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
}

h1 {
    text-align: center;
    margin: 8px 0 20px;
}

.summary {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 20px;
}

.card {
    background: white;
    border-radius: 14px;
    padding: 18px;
    box-shadow: 0 4px 15px #00000010;
}

.card small {
    color: #667085;
}

.card strong {
    display: block;
    font-size: 24px;
    margin-top: 7px;
}

.months {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
}

.month {
    background: white;
    border-radius: 14px;
    padding: 16px;
    box-shadow: 0 4px 15px #00000010;
}

.month h2 {
    font-size: 18px;
    margin: 0 0 12px;
}

.total {
    font-weight: bold;
    margin: 10px 0;
}

.days {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 5px;
}

.day {
    text-align: center;
}

.day label {
    font-size: 11px;
    color: #667085;
}

.day input {
    width: 100%;
    padding: 7px 2px;
    border: 1px solid #d8dee8;
    border-radius: 7px;
    text-align: center;
    font-size: 12px;
}

.day input:focus {
    outline: 2px solid #8ab4ff;
    border-color: #4285f4;
}

.actions {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin: 20px 0;
    flex-wrap: wrap;
}

button {
    border: 0;
    border-radius: 9px;
    padding: 11px 18px;
    cursor: pointer;
    font-weight: bold;
}

.save {
    background: #1677ff;
    color: white;
}

.clear {
    background: #e9edf3;
    color: #172033;
}

@media(max-width:800px) {
    .months {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media(max-width:550px) {
    .summary {
        grid-template-columns: 1fr;
    }

    .months {
        grid-template-columns: 1fr;
    }

    .container {
        padding: 12px;
    }
}
</style>
</head>

<body>

<div class="container">

<h1>📊 Thống kê tiền năm</h1>

<div class="summary">

    <div class="card">
        <small>Tổng cả năm</small>
        <strong id="yearTotal">0 ₫</strong>
    </div>

    <div class="card">
        <small>Trung bình / ngày</small>
        <strong id="dailyAvg">0 ₫</strong>
    </div>

    <div class="card">
        <small>Tháng cao nhất</small>
        <strong id="bestMonth">-</strong>
    </div>

</div>

<div class="actions">

    <button class="save" onclick="saveData()">
        💾 Lưu dữ liệu
    </button>

    <button class="clear" onclick="clearData()">
        🗑️ Xóa toàn bộ
    </button>

</div>

<div class="months" id="months"></div>

</div>

<script>

const monthNames = [
    "Tháng 1",
    "Tháng 2",
    "Tháng 3",
    "Tháng 4",
    "Tháng 5",
    "Tháng 6",
    "Tháng 7",
    "Tháng 8",
    "Tháng 9",
    "Tháng 10",
    "Tháng 11",
    "Tháng 12"
];

const monthsEl = document.getElementById("months");

function money(number) {

    return new Intl.NumberFormat("vi-VN")
        .format(number) + " ₫";

}

function daysInMonth(month) {

    return new Date(2026, month + 1, 0).getDate();

}

function build() {

    monthsEl.innerHTML = "";

    monthNames.forEach((name, month) => {

        const box = document.createElement("div");

        box.className = "month";

        box.innerHTML = `
            <h2>${name}</h2>

            <div class="total">
                Tổng:
                <span id="total-${month}">
                    0 ₫
                </span>
            </div>

            <div class="days" id="days-${month}"></div>
        `;

        monthsEl.appendChild(box);

        const days = box.querySelector(".days");

        for (
            let day = 1;
            day <= daysInMonth(month);
            day++
        ) {

            const wrap = document.createElement("div");

            wrap.className = "day";

            wrap.innerHTML = `
                <label>${day}</label>

                <input
                    type="number"
                    min="0"
                    step="1000"
                    data-month="${month}"
                    data-day="${day}"
                    placeholder="0"
                >
            `;

            days.appendChild(wrap);

        }

    });

    document.querySelectorAll("input").forEach(input => {

        input.addEventListener("input", update);

    });

    loadData();

    update();

}

function update() {

    let year = 0;
    let count = 0;

    let totals = [];

    for (let month = 0; month < 12; month++) {

        let total = 0;

        document
            .querySelectorAll(
                `input[data-month="${month}"]`
            )
            .forEach(input => {

                const value = Number(input.value) || 0;

                total += value;

                if (input.value !== "") {
                    count++;
                }

            });

        document.getElementById(
            `total-${month}`
        ).textContent = money(total);

        totals.push(total);

        year += total;

    }

    document.getElementById(
        "yearTotal"
    ).textContent = money(year);

    document.getElementById(
        "dailyAvg"
    ).textContent = money(
        count ? year / count : 0
    );

    const max = Math.max(...totals);

    document.getElementById(
        "bestMonth"
    ).textContent =
        max > 0
        ? `${monthNames[totals.indexOf(max)]} — ${money(max)}`
        : "-";

}

function saveData() {

    const data = {};

    document.querySelectorAll("input").forEach(input => {

        if (input.value !== "") {

            const key =
                input.dataset.month +
                "-" +
                input.dataset.day;

            data[key] = input.value;

        }

    });

    localStorage.setItem(
        "moneyStats2026",
        JSON.stringify(data)
    );

    alert("Đã lưu dữ liệu!");

}

function loadData() {

    const data =
        JSON.parse(
            localStorage.getItem(
                "moneyStats2026"
            ) || "{}"
        );

    document.querySelectorAll("input").forEach(input => {

        const key =
            input.dataset.month +
            "-" +
            input.dataset.day;

        if (data[key] !== undefined) {

            input.value = data[key];

        }

    });

}

function clearData() {

    if (
        confirm(
            "Bạn có chắc muốn xóa toàn bộ dữ liệu?"
        )
    ) {

        localStorage.removeItem(
            "moneyStats2026"
        );

        document.querySelectorAll("input")
            .forEach(input => {
                input.value = "";
            });

        update();

    }

}

build();

</script>

</body>
</html>
